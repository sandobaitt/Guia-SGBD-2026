<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica 1er Parcial</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1d2125; --muted:#5f6b7a; --line:#d9dde3;
  --brand:#0f6cbf; --brand-ink:#ffffff; --brand-soft:#e7f0fa;
  --ok:#1f7a3a; --ok-soft:#e5f4ea; --bad:#b42318; --bad-soft:#fdecea;
  --part:#9a6700; --part-soft:#fff4d6; --fb:#fcefdc; --fb-ink:#7a4a12;
  --sel:#eef4fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c; --card:#1e2227; --ink:#e6e8eb; --muted:#9aa4b1; --line:#323840;
    --brand:#4c9be8; --brand-ink:#0b1420; --brand-soft:#1c2a3a;
    --ok:#5fcf80; --ok-soft:#173222; --bad:#ff7b72; --bad-soft:#3a1d1b;
    --part:#e3b341; --part-soft:#3a2f12; --fb:#2e2416; --fb-ink:#f0c58a; --sel:#1f2b38;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c; --card:#1e2227; --ink:#e6e8eb; --muted:#9aa4b1; --line:#323840;
  --brand:#4c9be8; --brand-ink:#0b1420; --brand-soft:#1c2a3a;
  --ok:#5fcf80; --ok-soft:#173222; --bad:#ff7b72; --bad-soft:#3a1d1b;
  --part:#e3b341; --part-soft:#3a2f12; --fb:#2e2416; --fb-ink:#f0c58a; --sel:#1f2b38;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top-in h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:180px}
.timer{font-variant-numeric:tabular-nums;font-weight:600;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:6px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.top .btn{padding:6px 12px}
.wrap{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 240px;gap:16px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.side{order:-1}}
.side{position:sticky;top:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
@media (max-width:860px){.side{position:static}}
.side h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nav a{display:flex;align-items:center;justify-content:center;height:34px;border:1px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;position:relative;background:var(--card)}
.nav a.ans{background:var(--brand-soft);border-color:var(--brand)}
.nav a.flag::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--part)}
.nav a.g-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nav a.g-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nav a.g-part{background:var(--part-soft);border-color:var(--part);color:var(--part)}
.side .opts{margin-top:12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.side .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.side .opts select{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:2px 4px}
.side .actions{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.progress{font-size:13px;color:var(--muted);margin-top:10px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.summary table{border-collapse:collapse;width:100%;font-size:14px}
.summary th{text-align:left;color:var(--muted);font-weight:600;padding:4px 12px 4px 0;width:150px;vertical-align:top}
.summary td{padding:4px 0}
.summary .big{font-size:22px;font-weight:700}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filter .btn.on{background:var(--brand-soft);border-color:var(--brand)}
.q{display:grid;grid-template-columns:120px 1fr;gap:0;margin-bottom:16px;scroll-margin-top:70px}
@media (max-width:640px){.q{grid-template-columns:1fr}}
.qinfo{background:var(--card);border:1px solid var(--line);border-radius:8px 0 0 8px;border-right:none;padding:10px;font-size:12px;color:var(--muted)}
@media (max-width:640px){.qinfo{border-radius:8px 8px 0 0;border-right:1px solid var(--line);border-bottom:none;display:flex;gap:10px;flex-wrap:wrap;align-items:center}}
.qinfo .num{font-size:14px;color:var(--ink);font-weight:700}
.qinfo .num b{font-size:18px}
.qinfo .st{margin:4px 0}
.qinfo .st.ok{color:var(--ok);font-weight:600}.qinfo .st.bad{color:var(--bad);font-weight:600}.qinfo .st.part{color:var(--part);font-weight:600}
.qinfo .unit{display:inline-block;margin-top:4px;font-weight:600;color:var(--brand)}
.flagbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.flagbtn.on{color:var(--part)}
.qbody{background:var(--card);border:1px solid var(--line);border-radius:0 8px 8px 0;overflow:hidden;min-width:0}
@media (max-width:640px){.qbody{border-radius:0 0 8px 8px}}
.qtext{padding:14px 16px 6px;font-size:15px}
.hint{padding:0 16px;font-size:13px;color:var(--muted)}
.answer{padding:8px 16px 14px;display:flex;flex-direction:column;gap:4px}
.opt{display:grid;grid-template-columns:22px 22px 1fr;gap:6px;align-items:start;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--sel)}
.opt input{margin:3px 0 0;accent-color:var(--brand);width:16px;height:16px;cursor:pointer}
.opt .l{color:var(--muted);font-weight:600}
.opt.chosen{background:var(--sel)}
.graded .opt{cursor:default}
.graded .opt:hover{background:transparent}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.mark{font-size:12px;font-weight:700;margin-left:6px;white-space:nowrap}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.ofb{display:block;font-size:13px;margin-top:3px;color:var(--ink);opacity:.85}
.fb{background:var(--fb);color:var(--fb-ink);padding:10px 16px;font-size:14px;border-top:1px solid var(--line)}
.fb p{margin:2px 0}
.units{margin-top:10px;font-size:13px;color:var(--muted)}
.units span{display:inline-block;margin-right:14px}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:20px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.foot{text-align:right;margin:8px 0 40px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>Práctica · 1er Parcial SGBD</h1>
    <span class="timer" id="timer">00:00</span>
    <button class="btn" id="themeBtn" title="Cambiar tema">Tema</button>
  </div>
</header>

<div class="wrap">
  <main id="main">
    <section class="summary hidden" id="summary"></section>
    <div id="questions"></div>
    <div class="foot" id="foot">
      <button class="btn primary" id="finishBtn2">Terminar intento…</button>
    </div>
  </main>

  <aside class="side">
    <h2>Navegación del cuestionario</h2>
    <div class="nav" id="nav"></div>
    <div class="progress" id="progress"></div>
    <div class="opts" id="setup">
      <label>Preguntas por intento
        <select id="nQ"><option value="30">30</option><option value="15">15</option><option value="0">Todas</option></select>
      </label>
      <label><input type="checkbox" id="shQ" checked> Mezclar preguntas</label>
      <label><input type="checkbox" id="shO" checked> Mezclar opciones</label>
    </div>
    <div class="actions">
      <button class="btn primary" id="finishBtn">Terminar intento…</button>
      <button class="btn" id="newBtn">Nuevo intento</button>
    </div>
  </aside>
</div>

<dialog id="confirm">
  <h3>¿Enviar todo y terminar?</h3>
  <p id="confirmMsg"></p>
  <div class="row">
    <button class="btn" id="cancelBtn">Volver al intento</button>
    <button class="btn primary" id="okBtn">Enviar todo y terminar</button>
  </div>
</dialog>

<script>
// Banco de preguntas de práctica (no son del parcial real). Cada intento toma una muestra al azar.
const BANK = [
{
"u": 1,
"t": "Seleccione DOS afirmaciones correctas sobre el log transaccional (WAL en PostgreSQL, redo log en InnoDB).",
"o": [
"Se escribe de forma secuencial, por eso persistirlo en el COMMIT es más barato que escribir cada página modificada.",
"Solo se usa para replicación; ante una caída, la recuperación depende exclusivamente del último backup completo.",
"Reemplaza al archivo de datos: una vez escrito el log, las páginas modificadas ya no necesitan volcarse nunca a disco.",
"Permite rehacer cambios confirmados cuyas páginas todavía no se habían escrito en el archivo de datos."
],
"f": "El COMMIT fuerza el log a disco (escritura secuencial y barata). Las páginas sucias se escriben después; si el servidor cae, la recuperación usa el log para rehacer lo confirmado.",
"m": 1,
"of": {
"2": "El log complementa al archivo de datos; el checkpoint termina volcando las páginas sucias."
}
},
{
"u": 1,
"t": "¿Cuál es el efecto principal de un checkpoint en el motor?",
"o": [
"Vuelca páginas sucias del buffer al archivo de datos y acota cuánto log hay que recorrer en una recuperación.",
"Elimina el log completo, porque después del checkpoint ya no sirve ni para recuperación, ni para réplica, ni para PITR.",
"Elige el plan de ejecución de las consultas que esperan en cola, en lugar del optimizador.",
"Confirma automáticamente las transacciones abiertas para que sus cambios no se pierdan si el servidor se cae antes del COMMIT."
],
"f": "El checkpoint sincroniza memoria y disco: después de él, la recuperación solo necesita aplicar el log posterior. No confirma transacciones ni decide planes."
},
{
"u": 1,
"t": "Una transacción modificó 500 filas sin hacer COMMIT. Un checkpoint ya escribió en disco algunas de esas páginas sucias. El servidor se cae. ¿Qué ocurre durante la recuperación?",
"o": [
"Los cambios quedan aplicados porque sus páginas ya estaban en el archivo de datos, aunque la transacción nunca haya confirmado.",
"La recuperación deshace los cambios no confirmados usando la información de undo, para dejar la base en un estado consistente.",
"El motor confirma la transacción automáticamente, porque la mayor parte de sus páginas ya había sido persistida antes de la caída.",
"La base queda inutilizable y la única salida es restaurar el último backup completo."
],
"f": "Atomicidad: lo no confirmado se revierte aunque haya llegado al disco. El log y la información de undo permiten deshacer esos cambios en la recuperación."
},
{
"u": 1,
"t": "Un DBA consulta information_schema o pg_catalog para listar las columnas e índices de una tabla. ¿Qué está consultando?",
"o": [
"Un volcado del buffer pool en disco que se regenera en cada checkpoint.",
"El log transaccional en un formato legible, ordenado por fecha de cada cambio de esquema.",
"Una copia de los datos de negocio que el motor replica para auditoría.",
"El catálogo: metadatos que el motor guarda sobre sus propios objetos y que también usan el parser y el optimizador."
],
"f": "El catálogo describe objetos, tipos, permisos, índices y estadísticas. El parser lo usa para validar y el optimizador para estimar costos."
},
{
"u": 1,
"t": "¿Qué afirmación sobre los términos base de datos y esquema es correcta en MySQL y PostgreSQL?",
"o": [
"En PostgreSQL son sinónimos, y en MySQL un esquema es un espacio de nombres que vive dentro de una base.",
"En ambos motores un esquema solo puede contener vistas, nunca tablas.",
"En ambos motores un esquema es siempre una instancia separada, con su propio puerto y su propio proceso del servidor.",
"En MySQL SCHEMA y DATABASE son sinónimos; en PostgreSQL un esquema es un espacio de nombres dentro de una base."
],
"f": "El mismo término cambia de significado según el motor: en MySQL CREATE SCHEMA = CREATE DATABASE; en PostgreSQL una base contiene esquemas (public, ventas, etc.)."
},
{
"u": 1,
"t": "Después de que una tabla creció mucho más que la memoria asignada al buffer, la tasa de aciertos de caché bajó de 99% a 70%. ¿Qué consecuencia es esperable?",
"o": [
"Más lecturas físicas al almacenamiento y mayor latencia en consultas que antes encontraban sus páginas en memoria.",
"El optimizador deja de usar índices de manera obligatoria hasta que se reinicie el servidor.",
"Ninguna: la tasa de aciertos es una estadística informativa y no influye en el tiempo de respuesta.",
"Las transacciones confirmadas dejan de ser durables porque ya no entran en memoria."
],
"f": "Cada miss obliga a traer la página desde el almacenamiento, lo que es mucho más lento que leer de memoria. La durabilidad no depende del buffer, sino del log."
},
{
"u": 1,
"t": "Se agrega un índice y se mueve una tabla a otro tablespace. Las consultas de la aplicación siguen funcionando sin cambios. ¿Qué propiedad de la arquitectura ANSI/SPARC lo permite?",
"o": [
"Replicación síncrona",
"Independencia física de datos",
"Independencia lógica de datos",
"Atomicidad de las transacciones"
],
"f": "La independencia física permite cambiar cómo se almacenan los datos (índices, archivos, tablespaces) sin afectar el nivel conceptual ni las aplicaciones."
},
{
"u": 1,
"t": "Seleccione DOS componentes o mecanismos que intervienen ANTES de que el ejecutor lea la primera página de una consulta.",
"o": [
"El parser, que valida la sintaxis y resuelve los objetos contra el catálogo.",
"El backup incremental, que prepara las páginas que va a necesitar la consulta.",
"El checkpoint, que decide qué índice usar en el SELECT.",
"El optimizador, que usa estadísticas para estimar costos y elegir un plan."
],
"f": "Primero se analiza y valida la sentencia, después se planifica y recién entonces se ejecuta sobre páginas en memoria.",
"m": 1
},
{
"u": 2,
"t": "Una consulta crítica usa WHERE cliente_id = ? AND fecha BETWEEN ? AND ? ORDER BY fecha. ¿Qué índice está mejor alineado con esa consulta?",
"o": [
"(cliente_id, fecha)",
"(fecha, cliente_id)",
"Dos índices separados, uno por fecha y otro por cliente_id, que siempre equivalen a un índice compuesto",
"(cliente_id) solamente, porque el ORDER BY fecha se resuelve sin costo después de filtrar"
],
"f": "Igualdad primero y rango después: con (cliente_id, fecha) el motor ubica al cliente, recorre el rango de fechas y ya obtiene las filas ordenadas, sin sort adicional."
},
{
"u": 2,
"t": "Existe un índice compuesto (pais, ciudad, barrio). ¿Qué consulta NO puede usarlo eficientemente como búsqueda?",
"o": [
"WHERE pais = 'AR' AND ciudad = 'Córdoba' AND barrio = 'Centro'",
"WHERE pais = 'AR' AND ciudad = 'Córdoba'",
"WHERE pais = 'AR'",
"WHERE ciudad = 'Córdoba' AND barrio = 'Centro'"
],
"f": "Regla del prefijo izquierdo: sin condición sobre la primera columna (pais), el índice no permite ubicar directamente el rango buscado."
},
{
"u": 2,
"t": "WHERE YEAR(fecha) = 2025 no aprovecha el índice que existe sobre fecha. ¿Qué reescritura conserva el resultado y permite usarlo?",
"o": [
"Mantener YEAR(fecha) y forzar el índice con un hint, porque el motor igual va a poder buscar dentro del árbol",
"WHERE YEAR(fecha) >= 2025 AND YEAR(fecha) <= 2025",
"WHERE fecha >= '2025-01-01' AND fecha < '2026-01-01'",
"WHERE CAST(fecha AS CHAR) LIKE '%2025%'"
],
"f": "Aplicar una función sobre la columna impide usar el orden del índice. Un rango sobre la columna sin modificar es equivalente y sí se puede resolver por índice."
},
{
"u": 2,
"t": "Seleccione DOS costos o efectos colaterales de agregar muchos índices a una tabla con alta tasa de INSERT.",
"o": [
"Deja de ser necesaria una clave primaria porque los índices ya identifican cada fila.",
"Más espacio en disco y más presión sobre el buffer para mantener esas estructuras.",
"Cada INSERT también debe actualizar cada índice, lo que aumenta el costo de escritura.",
"Las lecturas se vuelven siempre más lentas porque el optimizador debe recorrer todos los índices en cada consulta."
],
"f": "Cada índice acelera algunas lecturas, pero ocupa espacio, compite por memoria y se mantiene en cada INSERT, UPDATE o DELETE.",
"m": 1,
"of": {
"3": "El optimizador elige un plan; no lee todos los índices en cada consulta."
}
},
{
"u": 2,
"t": "La columna activo vale 'S' en el 97% de las filas. Para WHERE activo = 'S' el optimizador elige Seq Scan aunque existe un índice sobre activo. ¿Cuál es la explicación más razonable?",
"o": [
"El índice está corrupto y hay que reconstruirlo antes de volver a ejecutar la consulta.",
"El predicado es poco selectivo: recuperar casi toda la tabla por índice implicaría muchos accesos adicionales y el scan resulta más barato.",
"El optimizador ignora siempre los índices definidos sobre columnas de texto o de un solo carácter.",
"Falta memoria: con más buffer el optimizador usaría el índice para devolver el 97% de las filas."
],
"f": "La selectividad determina si conviene un índice. Si hay que leer casi todas las filas, un recorrido secuencial suele costar menos que miles de accesos puntuales."
},
{
"u": 2,
"t": "La tabla pedido está particionada por mes de fecha. Una consulta filtra solo por cliente_id, sin condición de fecha. ¿Qué es esperable?",
"o": [
"La consulta falla porque toda consulta sobre una tabla particionada tiene que incluir la clave de partición.",
"El particionamiento garantiza que la consulta sea más rápida que en una tabla sin particionar, porque divide el trabajo.",
"No hay poda de particiones: el motor debe considerar todas y el rendimiento va a depender de los índices de cada partición.",
"El motor lee solamente la partición del mes actual, porque es la que se usa por defecto."
],
"f": "El partition pruning aparece solo cuando el predicado involucra la clave de partición. Sin ese filtro, particionar puede no ayudar o incluso agregar costo."
},
{
"u": 2,
"t": "En PostgreSQL, EXPLAIN ANALYZE muestra Index Only Scan con Heap Fetches: 0. ¿Qué indica?",
"o": [
"Que la tabla se leyó completa desde el heap y el índice solo se usó para ordenar.",
"Que el índice estaba desactualizado y el motor tuvo que ignorarlo para leer el heap.",
"Que la consulta no devolvió ninguna fila, porque el heap estaba vacío.",
"Que el índice tenía todas las columnas necesarias y no fue necesario visitar la tabla para obtener las filas."
],
"f": "Un índice de cobertura permite responder solo con el índice. Heap Fetches indica cuántas veces igual hizo falta ir a la tabla (por ejemplo, para verificar visibilidad)."
},
{
"u": 2,
"t": "En MySQL, EXPLAIN muestra Using filesort y el contador Sort_merge_passes crece en cada ejecución. ¿Cuál es la lectura más adecuada?",
"o": [
"Filesort significa que la tabla está guardada ordenada en un archivo aparte, así que la operación no tiene costo relevante.",
"Indica que la consulta usa el índice óptimo y que no queda nada por revisar.",
"El ordenamiento no entra en memoria y el motor hace pasadas a disco; conviene evaluar un índice que entregue el orden o ajustar el buffer de sort y volver a medir.",
"Sort_merge_passes mide la cantidad de backups pendientes de la tabla."
],
"f": "Caso visto en la U2: si el sort desborda la memoria, el motor hace pasadas de merge en disco. La corrección debe atacar esa causa y validarse con una nueva medición."
},
{
"u": 2,
"t": "EXPLAIN (sin ANALYZE) muestra cost=0.43..1200 y rows=50. ¿Qué se puede afirmar?",
"o": [
"La consulta tardó 1200 ms y devolvió exactamente 50 filas.",
"El costo está en milisegundos y se puede comparar directamente con el de otro motor.",
"50 es la cantidad exacta de páginas que se leyeron del disco.",
"Son estimaciones del optimizador; para conocer filas y tiempos reales hay que ejecutar con ANALYZE."
],
"f": "EXPLAIN solo muestra el plan estimado, con costos en unidades internas. EXPLAIN ANALYZE ejecuta la consulta y agrega filas reales, tiempos y loops."
},
{
"u": 2,
"t": "En un experimento, un índice nuevo bajó una lectura de 900 ms a 40 ms, pero una carga masiva de INSERT pasó de 2 s a 5 s. ¿Qué veredicto es el más defendible?",
"o": [
"Depende de la carga real: la frecuencia y la criticidad de las lecturas y de las escrituras definen si conviene ese intercambio.",
"El experimento no es válido, porque en diseño físico las escrituras no se miden.",
"El índice nunca conviene, porque empeoró una de las operaciones medidas.",
"El índice conviene siempre, porque la mejora de lectura es proporcionalmente mayor que la pérdida en escritura."
],
"f": "El diseño físico parte de la matriz de carga. Un mismo índice puede ser la mejor decisión en un sistema de consulta y una mala decisión en uno de ingesta intensiva."
},
{
"u": 2,
"t": "Se propone agregar a PEDIDO una columna total_pedido, mantenida por trigger, para acelerar un reporte. ¿Qué hay que evaluar antes de aceptarla?",
"o": [
"Que el total se calcule solamente en la interfaz web, para no tocar la base.",
"Que el trigger permita eliminar la tabla de detalle, ya que el total contiene toda la información necesaria.",
"Nada: desnormalizar siempre mejora el diseño, porque evita joins.",

{
"u": 3,

{
"u": 3,
"t": "Se quieren listar TODOS los clientes con sus pedidos de 2025, incluidos los que no tienen pedidos. Se escribe: FROM cliente c LEFT JOIN pedido p ON p.cliente_id = c.cliente_id WHERE p.fecha >= '2025-01-01'. ¿Qué problema tiene?",
"o": [

"f": "Una condición sobre la tabla derecha en el WHERE elimina las filas sin coincidencia (NULL). Si el filtro va en el ON, solo restringe qué pedidos se combinan."

{
"u": 3,
"t": "Una CTE recursiva sobre responsable_id no termina porque los datos tienen un ciclo (A responde a B y B responde a A). ¿Qué medida es adecuada?",

"Crear un índice sobre responsable_id, porque el índice detecta y corta los ciclos de manera automática.",
"Reemplazar la recursión por tres INNER JOIN fijos, aunque la jerarquía pueda tener más niveles."
],
"f": "La recursión termina cuando el paso recursivo no produce filas nuevas. Si hay un ciclo, siempre las produce, así que hay que controlar el camino o la profundidad."
},
{
"u": 3,
"t": "Se buscan los clientes que nunca hicieron un pedido. pedido.cliente_id admite NULL. ¿Qué formulación es la más robusta?",

"WHERE c.cliente_id NOT IN (SELECT cliente_id FROM pedido)",
"INNER JOIN pedido p ON p.cliente_id = c.cliente_id WHERE p.cliente_id IS NULL",
"GROUP BY c.cliente_id HAVING COUNT(*) > 0"

"f": "Si la subconsulta devuelve algún NULL, NOT IN da UNKNOWN para todas las filas y no devuelve nada. NOT EXISTS no tiene ese problema."
},
{

"t": "SUM(monto) OVER (PARTITION BY cliente_id ORDER BY fecha) muestra el mismo acumulado en dos ventas del mismo día. ¿Por qué?",

"f": "El marco es parte de la semántica: RANGE trata a los empatados como pares y ROWS cuenta filas físicas. Conviene explicitar el marco y desempatar el ORDER BY."
},
{

{
"u": 3,
"t": "Una aplicación inserta 50.000 filas con un INSERT por fila en modo autocommit. ¿Qué cambio reduce más el costo sin cambiar el resultado?",

{

{

"t": "La tabla producto tiene CHECK (precio > 0) y se inserta una fila con precio NULL. ¿Qué ocurre?",

{

{
"u": 4,
"t": "Una migración ejecuta ALTER TABLE ... ADD COLUMN y luego un UPDATE que falla, todo entre BEGIN y ROLLBACK. ¿Qué diferencia entre motores hay que tener en cuenta?",
"o": [
"En PostgreSQL el DDL es transaccional y se revierte; en MySQL el DDL hace un commit implícito y el ALTER queda aplicado.",
"En ambos motores el ALTER se revierte siempre junto con el UPDATE.",
"En ningún motor se puede ejecutar DDL dentro de una transacción explícita.",
"En MySQL el ALTER se revierte y en PostgreSQL queda aplicado."
],
"f": "PostgreSQL admite DDL transaccional. En MySQL cada sentencia DDL confirma implícitamente, así que una migración a medias puede dejar el esquema en un estado intermedio."
},
{

"t": "El rollback de v2 elimina la columna estado de PEDIDO, pero ya se registraron pedidos con estado durante un día de operación. ¿Qué riesgo tiene ejecutarlo?",

{

{

{
"u": 5,
"t": "Seleccione DOS afirmaciones correctas sobre los niveles de aislamiento.",
"o": [

"f": "Es el experimento de las dos lecturas: READ COMMITTED (por defecto en PostgreSQL) ve los cambios confirmados entre lecturas; REPEATABLE READ (por defecto en MySQL) mantiene la instantánea.",

"t": "Dos sesiones leen saldo = 1000. Cada una calcula en la aplicación saldo - 100 y ejecuta UPDATE cuenta SET saldo = 900. El saldo final queda en 900. ¿Qué anomalía es y cómo se evita?",

"f": "Si el valor se lee, se calcula afuera y se escribe sin bloqueo, una escritura pisa a la otra. La solución es que la operación sea atómica o bloquear la fila al leerla."

"u": 5,
"t": "La sesión A bloquea la fila 1 y pide la fila 2; la sesión B bloquea la fila 2 y pide la fila 1. ¿Qué hace normalmente el motor?",

{

"t": "¿Qué práctica reduce la probabilidad de deadlocks en una aplicación?",

{
"u": 5,
"t": "En un motor con MVCC, la sesión A tiene un UPDATE sin confirmar sobre una fila. La sesión B, en READ COMMITTED, hace un SELECT común de esa fila. ¿Qué ocurre normalmente?",

"f": "Con MVCC, los lectores no bloquean a los escritores ni los escritores a los lectores. La espera aparece cuando dos escrituras compiten por la misma fila, o con lecturas que bloquean (FOR UPDATE)."

{

"t": "A las 14:32 se ejecutó por error un DELETE sin WHERE. Hay un backup completo de las 03:00 y logs (binlog o WAL) continuos. ¿Cuál es el procedimiento adecuado?",
"o": [
"Aplicar todos los logs hasta el momento actual, incluido el DELETE, para no perder ninguna transacción.",
"Restaurar el backup de las 03:00 y dar por terminada la recuperación, aceptando la pérdida de toda la mañana.",
"Restaurar el backup de las 03:00, aplicar los logs hasta justo antes del DELETE y validar el resultado.",
"Promover la réplica, que conserva los datos que se borraron en el primario."
],
"f": "PITR: restore del backup base + recovery aplicando logs hasta el punto objetivo (antes del error) + validación con conteos y registros clave."
},

"o": [

"Porque la réplica nunca recibe sentencias DELETE, solo INSERT y UPDATE.",
"Porque la réplica siempre corre en otra versión del motor y no puede leer los datos del primario.",
"Porque la réplica aplica el mismo cambio y también pierde los datos: protege contra la caída de un nodo, no contra errores lógicos."
],
"f": "Alta disponibilidad y backup resuelven problemas distintos. La réplica copia fielmente también los errores; para volver atrás en el tiempo hace falta un backup más logs."
},
{
"u": 6,
"t": "¿Cuál es la diferencia principal entre la replicación síncrona y la asíncrona?",
"o": [
"La asíncrona garantiza RPO cero porque envía los cambios en segundo plano.",
"La síncrona no agrega latencia a las escrituras, porque la réplica confirma en paralelo.",
"Son equivalentes; solo cambia el nombre según el motor.",
"La síncrona confirma después de que la réplica recibe o persiste el cambio (menos pérdida, más latencia); la asíncrona confirma sin esperar y puede perder lo que no se replicó."
],
"f": "Es un intercambio entre RPO y latencia: esperar a la réplica protege los datos y hace más lenta cada escritura confirmada."
},
{
"u": 6,
"t": "Durante un failover, el primario anterior vuelve a la red y sigue aceptando escrituras, mientras la réplica promovida también las acepta. ¿Qué problema es y cómo se previene?",
"o": [
"Es un deadlock distribuido que el motor resuelve eligiendo una víctima.",
"Es lag de replicación normal y se corrige solo cuando la red se estabiliza.",
"Es split brain: dos nodos aceptan escrituras divergentes. Se previene aislando (fencing) al primario anterior o con quórum o un árbitro.",
"Es el comportamiento esperado de un backup incremental."
],
"f": "Volver a dar servicio no alcanza: hay que garantizar que haya un solo primario. Con dos nodos sin árbitro, el riesgo de split brain es alto."
},

"pg_dump por sí solo permite recuperar la base a cualquier segundo posterior a la hora del dump.",
"Un backup lógico (mysqldump, pg_dump) exporta definiciones y datos; es portable, pero en bases grandes suele restaurarse más lento."
],
"f": "El tipo de backup condiciona qué tan rápido se restaura y hasta qué punto se puede recuperar.",
"m": 1,
"of": {
"2": "pg_dump es una foto de un instante. Para PITR en PostgreSQL hace falta un base backup físico más el WAL archivado."
}
},
{
"u": 6,
"t": "¿Qué opción de mysqldump genera un backup consistente de tablas InnoDB sin bloquear las escrituras durante toda la copia?",
"o": [

"--skip-triggers",
"--compact",
"--no-data"
],
"f": "--single-transaction abre una transacción con una instantánea consistente (MVCC). Con --source-data / --master-data además se registran las coordenadas del binlog para PITR."

"Que la réplica esté encendida y respondiendo consultas.",

],

// Índices correctos (base64) en el orden de BANK, para no ver las respuestas al leer el código.
const K = JSON.parse(atob("W1swLDNdLFswXSxbMV0sWzNdLFszXSxbMF0sWzFdLFswLDNdLFswXSxbM10sWzJdLFsxLDJdLFsxXSxbMl0sWzNdLFsyXSxbM10sWzBdLFszXSxbMSwyXSxbMl0sWzNdLFsxXSxbMF0sWzBdLFswXSxbMCwzXSxbMl0sWzBdLFsxXSxbMF0sWzNdLFswXSxbMV0sWzEsMl0sWzBdLFsxXSxbM10sWzNdLFswLDNdLFsxXSxbMV0sWzFdLFsxXSxbM10sWzNdLFszXSxbMSwyXSxbMF0sWzFdLFszXSxbMSwzXSxbM10sWzFdLFsyXSxbM10sWzNdLFsyXSxbMSwzXSxbMF0sWzJdLFswXSxbM10sWzFdXQ=="));
const UNITS = {1:"Arquitectura",2:"Diseño físico",3:"SQL avanzado",4:"Programabilidad",5:"Transacciones y concurrencia",6:"Seguridad y recuperación"};

const LET = "abcdefgh";
const STORE = "practica-p1-sgbd-v1";
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let st; // {qOrder, oOrder[], ans{}, flags{}, start, end, graded}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function save(){try{localStorage.setItem(STORE,JSON.stringify(st));}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(STORE));}catch(e){return null;}}

function newAttempt(){
  const shQ=$("#shQ").checked, shO=$("#shO").checked, nQ=+$("#nQ").value;
  const n = nQ && nQ<BANK.length ? nQ : BANK.length;
  let pick = shuffle([...BANK.keys()]).slice(0,n);
  if(!shQ) pick.sort((a,b)=>a-b);
  st={qOrder: pick,
      oOrder: BANK.map(q=>{const r=[...q.o.keys()];return shO?shuffle(r):r;}),
      ans:{}, flags:{}, start:Date.now(), end:null, graded:false, shQ, shO, nQ};
  save(); render(); window.scrollTo(0,0);
}

function isMulti(qi){return K[qi].length>1;}

function scoreQ(qi){
  const sel=st.ans[qi]||[], ok=K[qi];
  if(!isMulti(qi)) return sel.length && ok.includes(sel[0]) ? 1 : 0;
  const per=1/ok.length; let s=0;
  sel.forEach(o=>{s+= ok.includes(o)? per : -per;});
  return Math.max(0,Math.min(1,s));
}

function render(){
  const qs=$("#questions"); qs.innerHTML="";
  qs.classList.toggle("graded",st.graded);
  st.qOrder.forEach((qi,n)=>{
    const q=BANK[qi], multi=isMulti(qi), sel=st.ans[qi]||[];
    const sc=st.graded?scoreQ(qi):null;
    let stTxt, stCls="";
    if(st.graded){
      if(!sel.length){stTxt="Sin contestar";stCls="bad";}
      else if(sc===1){stTxt="Correcta";stCls="ok";}
      else if(sc===0){stTxt="Incorrecta";stCls="bad";}
      else {stTxt="Parcialmente correcta";stCls="part";}
    } else stTxt = sel.length?"Respuesta guardada":"Sin responder aún";
    const el=document.createElement("div"); el.className="q"; el.id="q"+(n+1);
    const opts=st.oOrder[qi].map((oi,pos)=>{
      const chosen=sel.includes(oi), correct=K[qi].includes(oi);
      let cls="opt"+(chosen?" chosen":""), mark="", ofb="";
      if(st.graded){
        if(chosen&&correct){cls+=" right";mark='<span class="mark ok">✓ Correcta</span>';}
        else if(chosen&&!correct){cls+=" wrong";mark='<span class="mark bad">✗ Incorrecta</span>';
          if(q.of&&q.of[oi]) ofb='<span class="ofb">'+esc(q.of[oi])+'</span>';}
        else if(!chosen&&correct){cls+=" missed";mark='<span class="mark ok">← respuesta correcta</span>';}
      }
      return `<label class="${cls}"><input type="${multi?"checkbox":"radio"}" name="r${qi}" value="${oi}" ${chosen?"checked":""} ${st.graded?"disabled":""}><span class="l">${LET[pos]}.</span><span>${esc(q.o[oi])}${mark}${ofb}</span></label>`;
    }).join("");
    const correctTxt = st.oOrder[qi].filter(oi=>K[qi].includes(oi)).map(oi=>esc(q.o[oi])).join(" · ");
    el.innerHTML=`
      <div class="qinfo">
        <div class="num">Pregunta <b>${n+1}</b></div>
        <div class="st ${stCls}">${stTxt}</div>
        <div>${st.graded?`Puntúa ${sc.toFixed(2).replace(".",",")} sobre 1,00`:"Puntúa como 1,00"}</div>
        ${st.graded?`<div class="unit">U${q.u} · ${UNITS[q.u]}</div>`:`<button class="flagbtn ${st.flags[qi]?"on":""}" data-flag="${qi}">${st.flags[qi]?"⚑ Marcada":"⚐ Marcar pregunta"}</button>`}
      </div>
      <div class="qbody">
        <div class="qtext">${esc(q.t)}</div>
        <div class="hint">${multi?"Seleccione una o más:":"Seleccione una:"}</div>
        <div class="answer">${opts}</div>
        ${st.graded?`<div class="fb"><p>${esc(q.f)}</p><p>${K[qi].length>1?"Las respuestas correctas son":"La respuesta correcta es"}: ${correctTxt}</p></div>`:""}
      </div>`;
    if(st.graded) el.dataset.res = stCls==="ok"?"ok":(stCls==="part"?"part":"bad");
    qs.appendChild(el);
  });
  renderNav(); renderSummary();
  $("#finishBtn").classList.toggle("hidden",st.graded);
  $("#foot").classList.toggle("hidden",st.graded);
  $("#shQ").checked=st.shQ!==false; $("#shO").checked=st.shO!==false;
  $("#nQ").value=String(st.nQ ?? 30);
}

function renderNav(){
  const nav=$("#nav"); nav.innerHTML="";
  let answered=0;
  st.qOrder.forEach((qi,n)=>{
    const a=document.createElement("a"); a.href="#q"+(n+1); a.textContent=n+1;
    const has=(st.ans[qi]||[]).length>0; if(has) answered++;
    if(st.graded){const s=scoreQ(qi); a.className = s===1?"g-ok":(s>0?"g-part":"g-bad");}
    else{ if(has) a.classList.add("ans"); if(st.flags[qi]) a.classList.add("flag"); }
    nav.appendChild(a);
  });
  $("#progress").textContent = st.graded ? "Intento finalizado" : `${answered} de ${st.qOrder.length} respondidas · banco de ${BANK.length}`;
}

function fmt(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}

let filter="all";
function renderSummary(){
  const box=$("#summary");
  if(!st.graded){box.classList.add("hidden");return;}
  const total=st.qOrder.reduce((a,qi)=>a+scoreQ(qi),0);
  const n=st.qOrder.length, ok=st.qOrder.filter(qi=>scoreQ(qi)===1).length;
  const part=st.qOrder.filter(qi=>{const s=scoreQ(qi);return s>0&&s<1;}).length;
  const dur=st.end-st.start;
  const byU={}; st.qOrder.forEach(qi=>{const u=BANK[qi].u; byU[u]=byU[u]||[0,0]; byU[u][0]+=scoreQ(qi); byU[u][1]++;});
  const units=Object.keys(byU).sort().map(u=>`<span>U${u} ${UNITS[u]}: <b>${byU[u][0].toFixed(1).replace(".",",")}/${byU[u][1]}</b></span>`).join("");
  box.classList.remove("hidden");
  box.innerHTML=`<table>
    <tr><th>Estado</th><td>Finalizado</td></tr>
    <tr><th>Tiempo empleado</th><td>${fmt(dur)}</td></tr>
    <tr><th>Puntos</th><td>${total.toFixed(2).replace(".",",")}/${n},00</td></tr>
    <tr><th>Calificación</th><td class="big">${(total/n*10).toFixed(2).replace(".",",")} de 10,00 (${Math.round(total/n*100)}%)</td></tr>
    <tr><th>Detalle</th><td>${ok} correctas · ${part} parciales · ${n-ok-part} incorrectas/sin contestar</td></tr>
  </table>
  <div class="units">${units}</div>
  <div class="filter">
    <button class="btn ${filter==="all"?"on":""}" data-f="all">Ver todas</button>
    <button class="btn ${filter==="bad"?"on":""}" data-f="bad">Solo errores</button>
    <button class="btn primary" data-f="new">Nuevo intento</button>
  </div>`;
  applyFilter();
}
function applyFilter(){
  document.querySelectorAll(".q").forEach(q=>{
    q.classList.toggle("hidden", filter==="bad" && q.dataset.res==="ok");
  });
}

// Eventos
$("#questions").addEventListener("change",e=>{
  const inp=e.target; if(!inp.matches("input")||st.graded) return;
  const qi=+inp.name.slice(1), oi=+inp.value;
  if(inp.type==="radio") st.ans[qi]=[oi];
  else{const s=new Set(st.ans[qi]||[]); inp.checked?s.add(oi):s.delete(oi); st.ans[qi]=[...s];}
  inp.closest(".answer").querySelectorAll(".opt").forEach(l=>l.classList.toggle("chosen",l.querySelector("input").checked));
  const box=inp.closest(".q").querySelector(".qinfo .st");
  box.textContent=(st.ans[qi]||[]).length?"Respuesta guardada":"Sin responder aún";
  save(); renderNav();
});
$("#questions").addEventListener("click",e=>{
  const b=e.target.closest("[data-flag]"); if(!b) return;
  const qi=+b.dataset.flag; st.flags[qi]=!st.flags[qi];
  b.classList.toggle("on",st.flags[qi]); b.textContent=st.flags[qi]?"⚑ Marcada":"⚐ Marcar pregunta";
  save(); renderNav();
});
$("#summary").addEventListener("click",e=>{
  const b=e.target.closest("[data-f]"); if(!b) return;
  if(b.dataset.f==="new"){filter="all";newAttempt();return;}
  filter=b.dataset.f; renderSummary();
});
function askFinish(){
  const un=st.qOrder.filter(qi=>!(st.ans[qi]||[]).length).length;
  $("#confirmMsg").textContent = un ? `Tenés ${un} pregunta${un>1?"s":""} sin responder. Una vez enviado no se pueden cambiar las respuestas.` : "Todas las preguntas tienen respuesta. Una vez enviado no se pueden cambiar las respuestas.";
  const d=$("#confirm"); if(d.showModal) d.showModal(); else if(confirm($("#confirmMsg").textContent)) finish();
}
function finish(){st.graded=true; st.end=Date.now(); filter="all"; save(); render(); window.scrollTo(0,0);}
$("#finishBtn").onclick=askFinish; $("#finishBtn2").onclick=askFinish;
$("#cancelBtn").onclick=()=>$("#confirm").close();
$("#okBtn").onclick=()=>{$("#confirm").close(); finish();};
$("#newBtn").onclick=()=>{
  if(!st.graded && Object.keys(st.ans).length && !confirm("Se descarta el intento actual. ¿Continuar?")) return;
  filter="all"; newAttempt();
};
$("#themeBtn").onclick=()=>{
  const r=document.documentElement, dark=r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark?"light":"dark"; try{localStorage.setItem(STORE+"-theme",r.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem(STORE+"-theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}

setInterval(()=>{ if(st) $("#timer").textContent = fmt((st.graded?st.end:Date.now())-st.start); },500);

const prev=load();
if(prev && Array.isArray(prev.qOrder) && prev.oOrder && prev.oOrder.length===BANK.length && prev.qOrder.every(i=>i<BANK.length)){st=prev; render();} else newAttempt();
</script>
</body>
